AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub OIDC Identity Provider and IAM Role for CSPM Scanner'

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or username
    Default: vibhoragarwal81
    
  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: Github-Copilot
    
  RoleName:
    Type: String
    Description: Name for the GitHub Actions IAM Role
    Default: GitHubActionsCSPMRole
    
  AllowAllBranches:
    Type: String
    Description: Allow access from all branches (true) or only main branch (false)
    Default: 'false'
    AllowedValues: ['true', 'false']
    
  SessionDuration:
    Type: Number
    Description: Maximum session duration in seconds (1 hour = 3600)
    Default: 3600
    MinValue: 900
    MaxValue: 43200

Conditions:
  AllowAllBranchesCondition: !Equals [!Ref AllowAllBranches, 'true']

Resources:
  # GitHub OIDC Identity Provider
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCIdentityProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Purpose
          Value: GitHubActions
        - Key: Repository
          Value: !Sub "${GitHubOrg}/${GitHubRepo}"

  # IAM Role for GitHub Actions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: !Ref SessionDuration
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - AllowAllBranchesCondition
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Policies:
        - PolicyName: CSPMOrganizationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Organizations permissions
              - Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:ListAccountsForParent
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:DescribeOrganization
                  - organizations:DescribeAccount
                  - organizations:ListParents
                  - organizations:ListChildren
                Resource: '*'
              
              # Cross-account role assumption
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: 
                  - !Sub 'arn:aws:iam::*:role/CSPMScanRole'
                  - !Sub 'arn:aws:iam::*:role/OrganizationAccountAccessRole'
              
              # Additional IAM permissions for CSPM scanning
              - Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetCredentialReport
                  - iam:GenerateCredentialReport
                  - iam:ListAccountAliases
                  - iam:ListUsers
                  - iam:ListRoles
                  - iam:ListGroups
                  - iam:ListPolicies
                  - iam:ListAttachedUserPolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListAttachedGroupPolicies
                  - iam:GetUser
                  - iam:GetRole
                  - iam:GetGroup
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:GetUserPolicy
                  - iam:GetRolePolicy
                  - iam:GetGroupPolicy
                  - iam:ListUserPolicies
                  - iam:ListRolePolicies
                  - iam:ListGroupPolicies
                  - iam:GetAccessKeyLastUsed
                  - iam:ListAccessKeys
                Resource: '*'
              
              # CloudTrail access for security analysis
              - Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:GetEventSelectors
                  - cloudtrail:ListTags
                Resource: '*'
              
              # Config service access
              - Effect: Allow
                Action:
                  - config:DescribeConfigRules
                  - config:DescribeConfigurationRecorders
                  - config:DescribeDeliveryChannels
                  - config:GetComplianceDetailsByConfigRule
                  - config:GetComplianceDetailsByResource
                Resource: '*'
              
              # Support for additional AWS services commonly used in CSPM
              - Effect: Allow
                Action:
                  - support:DescribeCases
                  - support:DescribeServices
                  - support:DescribeSeverityLevels
                  - trustedadvisor:Describe*
                Resource: '*'
      Tags:
        - Key: Purpose
          Value: GitHubActionsCSPM
        - Key: Repository
          Value: !Sub "${GitHubOrg}/${GitHubRepo}"
        - Key: ManagedBy
          Value: CloudFormation

  # Cross-account role for member accounts (template for deployment)
  CSPMScanRoleTemplate:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CSPMScanRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub '${GitHubActionsRole}'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'sts:ExternalId': 'CSPM-Scanner'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Tags:
        - Key: Purpose
          Value: CSPMCrossAccountAccess
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC Identity Provider
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderArn'
  
  GitHubActionsRoleArn:
    Description: ARN of the GitHub Actions IAM Role
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsRoleArn'
  
  GitHubActionsRoleName:
    Description: Name of the GitHub Actions IAM Role
    Value: !Ref GitHubActionsRole
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsRoleName'
  
  CSPMScanRoleArn:
    Description: ARN of the CSPM Scan Role (for current account)
    Value: !GetAtt CSPMScanRoleTemplate.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CSPMScanRoleArn'
  
  RepositoryVariable:
    Description: Value to set for AWS_ROLE_ARN repository variable in GitHub
    Value: !GetAtt GitHubActionsRole.Arn
  
  TrustPolicySubject:
    Description: The subject claim used in the trust policy
    Value: !If
      - AllowAllBranchesCondition
      - !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main"
  
  NextSteps:
    Description: Next steps for completing the setup
    Value: |
      1. Set AWS_ROLE_ARN repository variable in GitHub to the GitHubActionsRoleArn value
      2. Deploy CSPMScanRole to member accounts using the cross-account template
      3. Test authentication with the test workflow
      4. Run CSPM scans from GitHub Actions
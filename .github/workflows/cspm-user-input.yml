name: CSPM Scanner - User Input

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan Mode'
        required: true
        default: 'single-account'
        type: choice
        options:
          - single-account
          - organization
      
      target_account:
        description: 'Target Account ID (for single-account mode, leave empty for current account)'
        required: false
        type: string
      
      regions:
        description: 'AWS Regions (comma-separated)'
        required: true
        default: 'us-east-1'
        type: string
      
      services:
        description: 'AWS Services to scan (comma-separated)'
        required: true
        default: 'iam,s3,ec2'
        type: string
      
      output_format:
        description: 'Output Format'
        required: false
        default: 'html'
        type: choice
        options:
          - html
          - json
          - csv

# Required permissions for OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1

jobs:
  cspm-scan:
    name: Run CSPM Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install boto3 pyyaml jinja2
        fi
    
    - name: Validate inputs
      run: |
        echo "Scan Mode: ${{ github.event.inputs.scan_mode }}"
        echo "Target Account: ${{ github.event.inputs.target_account || 'current' }}"
        echo "Regions: ${{ github.event.inputs.regions }}"
        echo "Services: ${{ github.event.inputs.services }}"
        echo "Output Format: ${{ github.event.inputs.output_format }}"
        
        if [ "${{ vars.AWS_ROLE_ARN }}" = "" ]; then
          echo "Error: AWS_ROLE_ARN repository variable is not set!"
          echo "Please configure the AWS_ROLE_ARN repository variable with the IAM role ARN from your CloudFormation deployment."
          exit 1
        fi
        echo "Using IAM Role: ${{ vars.AWS_ROLE_ARN }}"
    
    # Primary authentication method: OIDC with IAM Role
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-CSPM-${{ github.run_number }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
        role-duration-seconds: 3600
    
    - name: Verify AWS Authentication
      run: |
        echo "Testing AWS authentication..."
        aws sts get-caller-identity
        echo "AWS authentication successful!"
    
    - name: Run CSPM Scan
      run: |
        echo "Starting CSPM scan..."
        
        # Determine account parameter
        if [ "${{ github.event.inputs.scan_mode }}" = "organization" ]; then
          ACCOUNT_PARAM="organization"
        elif [ "${{ github.event.inputs.target_account }}" != "" ]; then
          ACCOUNT_PARAM="${{ github.event.inputs.target_account }}"
        else
          ACCOUNT_PARAM="current"
        fi
        
        echo "Running scan with parameters:"
        echo "  Account(s): $ACCOUNT_PARAM"
        echo "  Regions: ${{ github.event.inputs.regions }}"
        echo "  Services: ${{ github.event.inputs.services }}"
        echo "  Output Format: ${{ github.event.inputs.output_format }}"
        
        # Create output directory
        mkdir -p reports/workflow-scan
        
        # Run the scan
        python scripts/run_workflow_scan.py \
          --regions "${{ github.event.inputs.regions }}" \
          --accounts "$ACCOUNT_PARAM" \
          --services "${{ github.event.inputs.services }}" \
          --output-format "${{ github.event.inputs.output_format }}" \
          --output-dir "reports/workflow-scan" \
          --verbose
    
    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cspm-scan-results-${{ github.run_number }}
        path: |
          reports/workflow-scan/*
        retention-days: 30
    
    - name: Display scan summary
      if: always()
      run: |
        echo "=== CSMP Scan Summary ==="
        echo "Scan Mode: ${{ github.event.inputs.scan_mode }}"
        echo "Target Account: ${{ github.event.inputs.target_account || 'current' }}"
        echo "Regions: ${{ github.event.inputs.regions }}"
        echo "Services: ${{ github.event.inputs.services }}"
        echo "Output Format: ${{ github.event.inputs.output_format }}"
        echo ""
        echo "Generated files:"
        find reports/workflow-scan -type f -name "*" 2>/dev/null || echo "No files found in reports/workflow-scan"
# GitHub Actions workflow for AWS Cloud Security Posture Management scanning.
# This workflow automatically scans AWS resources and generates security posture reports
# with interactive HTML dashboards, compliance analysis, and artifact storage.

name: AWS IAMCloud Security Scan

on:
  # Run on schedule (weekly on Sundays at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 0'
  
  # Allow manual triggering with customizable parameters
  workflow_dispatch:
    inputs:
      aws_regions:
        description: 'AWS regions to scan (comma-separated)'
        required: true
        default: 'us-east-1,us-west-2'
        type: string
      
      aws_accounts:
        description: 'AWS account IDs to scan (comma-separated) or "organization" for org-wide scan'
        required: true
        default: 'organization'  # Default to organization-wide scan
        type: string
      
      services:
        description: 'AWS services to scan'
        required: true
        default: 'iam,ec2,vpc,s3'
        type: choice
        options:
          - 'iam,ec2,vpc,s3'
          - 'iam,ec2'
          - 'iam,vpc'
          - 'ec2,vpc,s3'
          - 'all'
      
      report_formats:
        description: 'Report output formats'
        required: true
        default: 'json,html,csv'
        type: choice
        options:
          - 'html'
          - 'json,html'
          - 'json,html,csv'
          - 'all'
      
      compliance_frameworks:
        description: 'Compliance frameworks to include'
        required: false
        default: 'CIS-AWS,NIST-CSF,PCI-DSS'
        type: string
      
      severity_filter:
        description: 'Minimum severity level to report'
        required: false
        default: 'info'
        type: choice
        options:
          - 'critical'
          - 'high'
          - 'medium'
          - 'low'
          - 'info'

  # Run on push to main branch (for testing changes)
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/workflows/**'
      - 'requirements.txt'

env:
  AWS_DEFAULT_REGION: us-east-1
  PYTHON_VERSION: '3.9'

jobs:
  security-scan:
    name: AWS Security Posture Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write  # Required for OIDC authentication with AWS IAM roles
    
    outputs:
      scan_status: ${{ steps.scan.outputs.status }}
      critical_findings: ${{ steps.scan.outputs.critical_count }}
      high_findings: ${{ steps.scan.outputs.high_count }}
      total_findings: ${{ steps.scan.outputs.total_count }}
      report_path: ${{ steps.scan.outputs.report_path }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        # cache: 'pip'  # Commented out to avoid GitHub Actions cache service issues
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directories
      run: |
        mkdir -p reports/scan-${{ github.run_number }}
        mkdir -p logs
        mkdir -p artifacts
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # OIDC with IAM Role (Recommended for GitHub Actions)
        role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-IAMCloud-Scan-${{ github.run_number }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
        
        # Session duration (default: 1 hour, max: 12 hours for role chaining)
        role-duration-seconds: 3600
    
    - name: Validate AWS connectivity
      run: |
        echo "🔍 Validating AWS connectivity..."
        aws sts get-caller-identity
        echo "✅ AWS connection successful"
    
    - name: Run unit tests
      run: |
        echo "🧪 Running unit tests..."
        python run_tests.py --unit --coverage
        echo "✅ Unit tests completed"
    
    - name: Execute IAMCloud security scan
      id: scan
      run: |
        echo "🚀 Starting AWS IAMCloud security scan..."
        
        # Set scan parameters from inputs or defaults
        REGIONS="${{ github.event.inputs.aws_regions || 'us-east-1' }}"
        ACCOUNTS="${{ github.event.inputs.aws_accounts || '123456789012' }}"
        SERVICES="${{ github.event.inputs.services || 'iam,ec2,vpc,s3' }}"
        FORMATS="${{ github.event.inputs.report_formats || 'json,html' }}"
        FRAMEWORKS="${{ github.event.inputs.compliance_frameworks || 'CIS-AWS,NIST-CSF' }}"
        SEVERITY="${{ github.event.inputs.severity_filter || 'info' }}"
        
        # Handle 'all' options
        if [ "$SERVICES" = "all" ]; then
          SERVICES="iam,ec2,vpc,s3,organization"
        fi
        
        if [ "$FORMATS" = "all" ]; then
          FORMATS="json,html,csv"
        fi
        
        echo "📋 Scan Configuration:"
        echo "  Regions: $REGIONS"
        echo "  Accounts: $ACCOUNTS" 
        echo "  Services: $SERVICES"
        echo "  Formats: $FORMATS"
        echo "  Frameworks: $FRAMEWORKS"
        echo "  Min Severity: $SEVERITY"
        
        # Execute the scan using our workflow-compatible script
        python scripts/run_workflow_scan.py \
          --regions "$REGIONS" \
          --accounts "$ACCOUNTS" \
          --services "$SERVICES" \
          --output-format "$FORMATS" \
          --compliance-frameworks "$FRAMEWORKS" \
          --min-severity "$SEVERITY" \
          --output-dir "reports/scan-${{ github.run_number }}" \
          --verbose \
          2>&1 | tee logs/IAMCloud-scan-${{ github.run_number }}.log
        
        # Capture scan results for outputs
        SCAN_EXIT_CODE=$?
        if [ $SCAN_EXIT_CODE -eq 0 ]; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ Scan failed with exit code: $SCAN_EXIT_CODE"
        fi
        
        # Parse scan results if JSON report exists
        JSON_REPORT=$(find reports/scan-${{ github.run_number }} -name "*.json" | head -1)
        if [ -f "$JSON_REPORT" ]; then
          CRITICAL_COUNT=$(cat "$JSON_REPORT" | jq -r '.summary.critical // 0')
          HIGH_COUNT=$(cat "$JSON_REPORT" | jq -r '.summary.high // 0') 
          TOTAL_COUNT=$(cat "$JSON_REPORT" | jq -r '.summary.total_findings // 0')
          
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          
          echo "📊 Scan Results Summary:"
          echo "  Critical findings: $CRITICAL_COUNT"
          echo "  High findings: $HIGH_COUNT" 
          echo "  Total findings: $TOTAL_COUNT"
        else
          echo "⚠️ No JSON report found for results parsing"
          echo "critical_count=0" >> $GITHUB_OUTPUT
          echo "high_count=0" >> $GITHUB_OUTPUT
          echo "total_count=0" >> $GITHUB_OUTPUT
        fi
        
        echo "report_path=reports/scan-${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "✅ IAMCloud scan completed successfully"
    
    - name: Generate scan summary for GitHub
      run: |
        echo "## 🛡️ AWS IAMCloud Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Scan Date**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Scan ID**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Regions Scanned**: ${{ github.event.inputs.aws_regions || 'us-east-1' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Accounts Scanned**: ${{ github.event.inputs.aws_accounts || '123456789012' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Services**: ${{ github.event.inputs.services || 'iam,ec2,vpc,s3' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Security Findings" >> $GITHUB_STEP_SUMMARY
        echo "- **Critical**: ${{ steps.scan.outputs.critical_count }}" >> $GITHUB_STEP_SUMMARY
        echo "- **High**: ${{ steps.scan.outputs.high_count }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Total**: ${{ steps.scan.outputs.total_count }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Report Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "Download the generated reports from the 'Artifacts' section below." >> $GITHUB_STEP_SUMMARY
        echo "The HTML dashboard provides an interactive view of all findings." >> $GITHUB_STEP_SUMMARY
    
    - name: Upload scan reports
      uses: actions/upload-artifact@v4
      if: always()  # Upload even if scan failed
      with:
        name: IAMCloud-reports-${{ github.run_number }}
        path: reports/scan-${{ github.run_number }}/
        retention-days: 30
        compression-level: 6
    
    - name: Upload scan logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: csmp-logs-${{ github.run_number }}
        path: logs/
        retention-days: 7
        compression-level: 6
    
    - name: Check for critical findings
      if: ${{ steps.scan.outputs.critical_count > 0 }}
      run: |
        echo "🚨 CRITICAL SECURITY FINDINGS DETECTED!"
        echo "Critical findings count: ${{ steps.scan.outputs.critical_count }}"
        echo "Immediate attention required for these security issues."
        # Optionally fail the workflow for critical findings
        # exit 1


  upload-to-s3:
    name: Archive Reports to S3
    runs-on: ubuntu-latest
    needs: security-scan
    if: success() && vars.S3_REPORTS_BUCKET
    
    steps:
    - name: Download scan reports
      uses: actions/download-artifact@v4
      with:
        name: IAMCloud-reports-${{ github.run_number }}
        path: reports/
    
    - name: Configure AWS credentials for S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # Use the same OIDC role if it has S3 permissions, or separate S3 role
        role-to-assume: ${{ vars.AWS_S3_ROLE_ARN || vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-IAMCloud-S3-${{ github.run_number }}
        aws-region: ${{ vars.S3_REGION || env.AWS_DEFAULT_REGION }}
    
    - name: Upload reports to S3
      run: |
        BUCKET="${{ vars.S3_REPORTS_BUCKET }}"
        DATE_PATH=$(date +%Y/%m/%d)
        S3_PATH="s3://$BUCKET/IAMCloud-reports/$DATE_PATH/run-${{ github.run_number }}/"
        
        echo "📤 Uploading reports to S3: $S3_PATH"
        aws s3 cp reports/ "$S3_PATH" --recursive --sse AES256
        
        echo "🔗 S3 Upload completed:"
        aws s3 ls "$S3_PATH" --human-readable
        
        # Create a public link if bucket allows
        echo "📍 Reports archived to: $S3_PATH"

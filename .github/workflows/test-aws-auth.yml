name: Test AWS OIDC Authentication

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: false
        default: 'quick'
        type: choice
        options:
        - quick
        - detailed
  push:
    paths:
    - '.github/workflows/test-aws-auth.yml'

# Required permissions for OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1

jobs:
  test-oidc-auth:
    name: Test OIDC Authentication
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pyyaml jinja2
    
    # Method 1: Test OIDC with IAM Role (preferred)
    - name: Configure AWS credentials via OIDC
      id: aws-oidc
      if: vars.AWS_ROLE_ARN != ''
      uses: aws-actions/configure-aws-credentials@v2
      continue-on-error: true
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-${{ github.run_number }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
        role-duration-seconds: 3600
    
    # Method 2: Fallback to Access Keys (if OIDC fails)
    - name: Configure AWS credentials via Access Keys
      if: steps.aws-oidc.outcome == 'failure' || vars.AWS_ROLE_ARN == ''
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    
    - name: Run AWS Authentication Test
      run: |
        echo "Running AWS authentication test..."
        python scripts/test_aws_auth.py
    
    - name: Quick CSPM Test (if test_mode is quick)
      if: github.event.inputs.test_mode == 'quick' || github.event.inputs.test_mode == ''
      run: |
        echo "Running quick CSPM test..."
        python scripts/run_workflow_scan.py \
          --scan-type single \
          --output-format html \
          --account-id current
    
    - name: Organization CSPM Test (if test_mode is detailed)
      if: github.event.inputs.test_mode == 'detailed'
      run: |
        echo "Running organization-wide CSPM test..."
        python scripts/run_workflow_scan.py \
          --scan-type organization \
          --output-format html
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aws-auth-test-results
        path: |
          reports/*.html
        retention-days: 7
